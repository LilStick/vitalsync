apiVersion: v1
kind: Service
metadata:
  name: vitalsync-backend
spec:
  selector:
    app: vitalsync-backend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: vitalsync-frontend
spec:
  selector:
    app: vitalsync-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
